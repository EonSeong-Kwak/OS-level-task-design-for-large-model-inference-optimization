[project]
name = "llmos"
version = "1.0.0"
description = "llmOS: 面向大模型推理优化的操作系统级仿真内核与评测台"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q --cov=llmos --cov-fail-under=70"

[tool.coverage.run]
source = ["backend/llmos"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
